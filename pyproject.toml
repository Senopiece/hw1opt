[project]
name = "hw1opt"
version = "0.1.0"
description = "CPU PyTorch experiments comparing cross-entropy and RobustCE"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=6.29,<8",
    "plotly>=6,<7",
    "torch>=2.11,<2.12",
]

[dependency-groups]
dev = [
    "nbclient>=0.10,<0.12",
    "nbformat>=5.10,<6",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
